            </h4></hgroup><div class="toolbar"><div id="cancel" tabindex="0" style="visibility: hidden"><span></span>Remove</div></div></div><script>

    /*/
    // DEBUG
    window.opera = (window.opera || {});
    window.VK_ENTER = (window.VK_ENTER || 13);

        setTimeout(callback, 1500, null);

    /*/

    if (opera.uninstallApp) {
        var appid = "";
        var button = document.getElementById("cancel");
        button.style.visibility = "";  // show it
        button.focus();

        window.addEventListener("keydown", function (evt) {
            if (evt.keyCode === VK_ENTER) {
                button.classList.add("ing");
                button.innerHTML = "<img src='https://tvstoremedia.global.ssl.fastly.net/static/3.6.3/images/loader-small.gif' alt=''/>" + gettext("Processing");
                // TODO log uninstalling
                opera.uninstallApp(appid, function (err) {
                    console.log(err);
                    history.back();
                });
            }
        }, false);
    }
    </script></body></html>
