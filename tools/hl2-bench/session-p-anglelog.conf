# Swim investigation, 2026-09-25: measure the view per frame. The module logs
# the engine's view angles and a timestamp every frame (SVRTV_ANGLELOG=1),
# natively and through gamescope, for the same kind of fast mouse turns.
# Run with: SVRTV_EXTRA="SVRTV_ANGLELOG=1" hl2-suite.sh session-p-anglelog.conf
# The TV can stay in 2D: this measures the picture's motion, not the 3D.
# gpu: nvidia
p13-vk-sbs-anglelog             220  vulkan  sbs             0  d1_town_01  play  HDMI-A-1
p14-vk-sbs-gamescope-anglelog   220  vulkan  sbs-gamescope   0  d1_town_01  play  HDMI-A-1
