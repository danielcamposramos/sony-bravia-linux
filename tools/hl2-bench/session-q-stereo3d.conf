# 2026-09-26: the in-game 3D offer (Valve PR 1), on HL2 with the module built
# from the SDK work tree (src/sourcevr_display, 32-bit, /K3D/temp/sdk-build).
# No preset layout: the game's own switches turn 3D on.
# q01: -stereo3d on the launch line (Steam's "3D SBS Vulkan" entry): native
#      side by side; anisotropic 16x and blur off applied, restored at exit.
#      Run with: HL2BENCH_ARGS="-stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q01-vk-stereo3d-launch
# q02: starts in 2D; Options > Video > "3D display: Side by side" turns 3D on
#      at once and off again (vr_display_3d; menu from hl2/custom/svrtv-3d-menu).
#      Run with: hl2-suite.sh session-q-stereo3d.conf --only q02-vk-stereo3d-menu
# q03: as q02 with GamepadUI on the desktop (-gamepadui), where the options
#      are data (gamepadui/options.res): Options > Video > "3D display"; and the
#      console switch both ways (module 60a7ec5a: 3D stays on until the
#      client has deactivated, so switching off restores the 2D menu).
#      Run with: HL2BENCH_ARGS="-gamepadui" hl2-suite.sh session-q-stereo3d.conf --only q03-vk-stereo3d-gamepadui
# q04: GamepadUI in 3D from the start (-gamepadui -stereo3d); module 1041f143
#      lays the UI out at the window's size when GamepadUI is loaded (it
#      ignores the client's 640x480 VR UI size, so its menus showed cropped).
#      Esc menu and Options in 3D should be whole.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q04-vk-stereo3d-gamepadui-3d
# q05: q04 again with module 274c8be2: GamepadUI detected from -gamepadui (the
#      library loads after the module makes its UI sheet, so q04 missed it),
#      and the "3D display" entry reads the real state (it read Disabled in 3D).
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q05-vk-stereo3d-gamepadui-3d
# q06: q05 with module 550d348a (the entry reads Side by side in 3D) and
#      screenshots every 2 s, to see the cramped GamepadUI sub-menus in 3D.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q06-vk-stereo3d-gamepadui-3d
# q07: module bf93faa6: the UI goes back to the window size inside the client's
#      Activate() (at its GetRenderTarget call), leaving no frame at 640x480;
#      q06 showed the Options panel laid out at 640x480 with full-size text.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q07-vk-stereo3d-gamepadui-3d
# gpu: nvidia
