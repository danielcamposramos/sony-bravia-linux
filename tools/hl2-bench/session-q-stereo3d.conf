# 2026-09-26: the in-game 3D offer (Valve PR 1), on HL2 with the module built
# from the SDK work tree (src/sourcevr_display, 32-bit, /K3D/temp/sdk-build).
# No preset layout: the game's own switches turn 3D on.
# q01: -stereo3d on the launch line (Steam's "3D SBS Vulkan" entry): native
#      side by side; anisotropic 16x and blur off applied, restored at exit.
#      Run with: HL2BENCH_ARGS="-stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q01-vk-stereo3d-launch
# q02: starts in 2D; Options > Video > "3D display: Side by side" turns 3D on
#      at once and off again (vr_display_3d; menu from hl2/custom/svrtv-3d-menu).
#      Run with: hl2-suite.sh session-q-stereo3d.conf --only q02-vk-stereo3d-menu
# q03: as q02 with GamepadUI on the desktop (-gamepadui), where the options
#      are data (gamepadui/options.res): Options > Video > "3D display"; and the
#      console switch both ways (module 60a7ec5a: 3D stays on until the
#      client has deactivated, so switching off restores the 2D menu).
#      Run with: HL2BENCH_ARGS="-gamepadui" hl2-suite.sh session-q-stereo3d.conf --only q03-vk-stereo3d-gamepadui
# q04: GamepadUI in 3D from the start (-gamepadui -stereo3d); module 1041f143
#      lays the UI out at the window's size when GamepadUI is loaded (it
#      ignores the client's 640x480 VR UI size, so its menus showed cropped).
#      Esc menu and Options in 3D should be whole.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q04-vk-stereo3d-gamepadui-3d
# q05: q04 again with module 274c8be2: GamepadUI detected from -gamepadui (the
#      library loads after the module makes its UI sheet, so q04 missed it),
#      and the "3D display" entry reads the real state (it read Disabled in 3D).
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q05-vk-stereo3d-gamepadui-3d
# q06: q05 with module 550d348a (the entry reads Side by side in 3D) and
#      screenshots every 2 s, to see the cramped GamepadUI sub-menus in 3D.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q06-vk-stereo3d-gamepadui-3d
# q07: module bf93faa6: the UI goes back to the window size inside the client's
#      Activate() (at its GetRenderTarget call), leaving no frame at 640x480;
#      q06 showed the Options panel laid out at 640x480 with full-size text.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q07-vk-stereo3d-gamepadui-3d
# q08: module db051208 and menu "3D display: Disabled / Side by side / Top and
#      bottom", applied with Apply. Starts in top and bottom (-stereo3d tab);
#      then Side by side, Top and bottom, Disabled from the menu, each on Apply.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d tab" hl2-suite.sh session-q-stereo3d.conf --only q08-vk-stereo3d-tab
# q09: the full 3D menu (Stereo 3D / 3D format / 3D output), applied with Apply
#      (one full reload), inside gamescope-3dtv, free-running; module 475e42cf.
#      Starts in 2D with GamepadUI; the output switches gamescope's effect.
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" hl2-suite.sh session-q-stereo3d.conf --only q09-vk-stereo3d-menu-gamescope
# q10: as q09, three cycles of Enabled/Apply, Disabled/Apply inside gamescope-3dtv,
#      to tell a race from a deterministic fault (q09 crashed in DXVK on the final
#      disable: pure virtual call during the device reset of the client's Deactivate).
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" hl2-suite.sh session-q-stereo3d.conf --only q10-vk-stereo3d-toggle-gamescope
# q11: module f2e33ad2: the UI sheet at the window's size for every UI (the 640x480
#      cap lifted; #8297 items 4 and 6), native, classic desktop menus (no
#      -gamepadui), -stereo3d: HUD, crosshair, Esc menu, Options dialog, pointer;
#      console vr_display_3d 0 / 1 switches off and on.
#      Run with: HL2BENCH_ARGS="-stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q11-vk-stereo3d-fullui
# q12: module 9d948618 and the menu entry "3D rendering resolution: VR original
#      (640x480) / Match the 3D output" (vr_display_resolution), GamepadUI, native,
#      -stereo3d, with the sprite fix for testing (sv_cheats 1; viewmodel_fov 90).
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q12-vk-stereo3d-resolution
# q13: module 34e6c731 (no pointer fence with GamepadUI in VR original), starting
#      in VR original (saved): in-game check of the client crosshair and sprite, the
#      menus, then Match the 3D output on Apply.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q13-vk-stereo3d-vroriginal
# q14: module 99dc1351 (VR original taken out: the UI and eyes always match the
#      output; no pointer fence), native, GamepadUI, -stereo3d: play, menus, TaB and
#      back on Apply.
#      Run with: HL2BENCH_ARGS="-gamepadui -stereo3d" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q14-vk-stereo3d-final-native
# q15: the same inside gamescope-3dtv: anaglyph (modern) and back on Apply.
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui -stereo3d" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q15-vk-stereo3d-final-gamescope
# q16: the #268 A/B, the other half: Valve's shipped client (no precache fix),
#      -stereo3d, console vr_hud_never_overlay 1 (the client's own in-world HUD
#      panel, vgui/inworldui): checkerboard or HUD? r02 showed the HUD with the fix.
#      Run with: HL2BENCH_ARGS="-stereo3d" hl2-suite.sh session-q-stereo3d.conf --only q16-vk-inworldui-ab
# q17: module 5db63a08: six formats (half and full TaB/SBS, frame packing 1080p/720p),
#      five outputs (3D display, anaglyph CRT/modern, row-interleaved, checkerboard),
#      swap eyes; inside gamescope-3dtv, GamepadUI, from 2D, each step on Apply.
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q17-vk-formats-outputs
# q18: module d4dcb535: composed outputs at full resolution through gamescope
#      (full SBS/TaB, -S stretch, techniques 0/1/3/4/6/9/10/11), swap eyes.
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q18-vk-composed-full
# q19: native rows and checkerboard (stencil composition, no gamescope).
#      Run with: HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q19-vk-composed-native
# q20: module 300e9018: gamescope started with a 3840x2160 nested screen
#      (GS_NESTED), so the gamescope menu offers half and full formats; full
#      composed outputs (techniques 9-11 for rows/checkerboard), -S stretch.
#      Run with: GS_NESTED=3840x2160 GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q20-vk-gamescope-full
# q21: module 18814471: the full formats inside gamescope resize gamescope's own
#      screen at run time (GAMESCOPE_XWAYLAND_MODE_CONTROL) before the mode switch;
#      gamescope launched at the 2D size. Part 1: mouse look and a full anaglyph.
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" hl2-suite.sh session-q-stereo3d.conf --only q21-vk-gamescope-resize
