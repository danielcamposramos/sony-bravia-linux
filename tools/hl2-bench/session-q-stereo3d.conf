# q22: mouse-pin isolation (2026-09-27). Module c41f63c6 = the q21 source with one
#      change: the startup X connection (publish_gamescope_screen) left out. q21b
#      pinned the mouse in the half formats inside gamescope, q17 did not, and that
#      call is the only q21 difference that runs there (the fence is off inside
#      gamescope, the frame-mode check only acts in full formats). Same launch as
#      q21b, plus the pointer log. Mouse free: that call is the cause.
#      Result: mouse free (Daniel: "mouse is fixed"; pointer log x 0-1514, y 0-1079
#      over 321 samples). Fix on stereo3d-full-res-wip: 2bc521b (the call and the
#      X screen-size lookups removed; module 470bed86).
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" SVRTV_EXTRA="SVRTV_MOUSELOG=1" hl2-suite.sh session-q-stereo3d.conf --only q22-vk-gamescope-mouse
# q23: the full formats inside gamescope, with the q22 fix (module 470bed86 =
#      stereo3d-full-res-wip 2bc521b) and gamescope's -S stretch, which its scale
#      math needs after the runtime resize (gamescope/RESOLUTIONS.md). gamescope
#      starts at the 2D size; choosing a full format resizes its screen to the
#      frame. Check: both eyes present and unpacked by the TV, the mouse free,
#      the anaglyph outputs from the full formats, and back to half.
#      Result: -S stretch alone breaks the mouse (the run never left half top and
#      bottom: no resize, 0 mode updates). Both eyes present; moving left sent the
#      aim right, up sent it down, and it snapped back to the centre, view and aim
#      together (vr_moveaim_mode 7); the UI cursor stayed in x 661-1217, y 466-609
#      (q22: the whole window). q22 and q23 differ only by -S stretch, at an exact
#      1:1 scale. Known upstream class: ValveSoftware/gamescope #2042, #1605.
#      Run with: GS_SCALER=stretch GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90" SVRTV_EXTRA="SVRTV_MOUSELOG=1" hl2-suite.sh session-q-stereo3d.conf --only q23-vk-gamescope-full-stretch
# q24: full eyes, no resize (module b7cff3a3 = stereo3d-full-res-wip + the full
#      formats render each eye at the whole 2D size and shrink it into the half
#      layout of the screen the game already has; no video mode, no gamescope
#      resize, no -S stretch). Plus longer pop-in distances, all client settings
#      without the cheat flag: cl_detaildist 2400, cl_detailfade 800,
#      r_propsmaxdist 2400, lod_TransitionDist 1600, r_rootlod 0. In one launch:
#      half top and bottom (540-line eyes) against full top and bottom (1080-line
#      eyes): popping and distant detail, the mouse, the log's 1920x1080 targets.
#      Result (2026-09-28): the mouse free (400 pointer samples across the whole
#      width), the full formats sharper (Daniel: "wow, what a blast"); the log shows
#      the 1920x1080 eye targets and no mode change. Daniel: full top and bottom is
#      the new recommended default (d8bbf6a). Popping with the longer distances:
#      to confirm.
#      Run with: GAMESCOPE_BIN=$HOME/.local/bin/gamescope-3dtv PLAY_PRESENT_INTERVAL=0 HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90;cl_detaildist 2400;cl_detailfade 800;r_propsmaxdist 2400;lod_TransitionDist 1600;r_rootlod 0" SVRTV_EXTRA="SVRTV_MOUSELOG=1" hl2-suite.sh session-q-stereo3d.conf --only q24-vk-gamescope-full-eyes
