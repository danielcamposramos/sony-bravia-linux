# q28: loading screens (Daniel, 2026-09-28: "load screens are single eye").
#      Module 3c564e5e = the released d69b1c57 plus SVRTV_CALLTRACE (off by
#      default): every gap over 200 ms between the calls the module receives,
#      and the calls made while the engine draws its loading image. Natively,
#      as q26: F6 loads d1_town_02 (map), and a save loaded from the menu.
#      Question: does the module get any call (a frame to composite) while a
#      loading screen shows? Read: "call gap" and "call while the loading
#      image is drawn" lines in the step's svrtv.log.
#      Result (2026-09-28, suite-20260928-023506, --force: an eye check; the log
#      fell back to bin/svrtv.log, the step folder being outside the runtime's
#      view): no frame reaches the module during a load. The calls stopped for
#      3.618 s and 1.552 s at the two loads (after GetEyeProjectionMatrix, the
#      last rendered view); the only calls while the engine drew its loading
#      image were ShouldRunInVR queries (4 logged, at most one a second), no
#      CompositeHud or DoDistortionProcessing. The engine draws the loading
#      screen once across the stereo frame (Daniel, TV 3D off: one image over
#      the whole frame, each eye getting half of it). The fix is the engine's:
#      in VR mode, draw it through the UI sheet and the module's composite like
#      the HUD (an ask for the pull request, with this run as evidence).
#      Run with: HL2BENCH_ARGS="-gamepadui" HL2BENCH_CMDS="sv_cheats 1;viewmodel_fov 90;bind F6 \"map d1_town_02\"" SVRTV_EXTRA="SVRTV_CALLTRACE=1" hl2-suite.sh session-q-stereo3d.conf --only q28-vk-native-loading
