# Swim investigation, 2026-09-25: p14 measured gamescope's uneven pacing
# (frames in 4 ms / 33 ms pairs, 80 zero-turn frames mid-turn). Here the game
# renders freely inside gamescope (DXVK present interval 0), so gamescope
# shows the newest frame at each refresh instead of queueing through two
# vsync stages. Angle log on, to compare with p13 (native) and p14.
# Run with: PLAY_PRESENT_INTERVAL=0 SVRTV_EXTRA="SVRTV_ANGLELOG=1" hl2-suite.sh session-p-gamescope-free.conf
# gpu: nvidia
p15-vk-sbs-gamescope-free   220  vulkan  sbs-gamescope   0  d1_town_01  play  HDMI-A-1
