# sony-bravia-linux rd1 browser-homepage lane (2026-09-15):
# impersonates rd1.sony.net on the LAN via an Unbound host override —
# the era browser's hardcoded homepage https://rd1.sony.net:443/tv1/
# then renders OUR portal (pattern proven by applicast-lan.conf).
# Era TLS profile: Presto 2.7.61 needs TLS 1.0 + AES128-SHA-class
# suites (verified live against tools/rd1-portal/serve.py on this LAN;
# SHA-1-signed self-signed cert — the open question is whether the era
# browser accepts it, this vhost is the live probe).
<VirtualHost *:443>
    ServerName rd1.sony.net
    DocumentRoot /var/www/rd1-portal

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/rd1.crt
    SSLCertificateKeyFile /etc/apache2/ssl/rd1.key
    SSLProtocol +TLSv1 +TLSv1.1 +TLSv1.2 +TLSv1.3
    SSLCipherSuite AES128-SHA:AES256-SHA:DES-CBC3-SHA:@SECLEVEL=0
    SSLHonorCipherOrder on

    ErrorLog ${APACHE_LOG_DIR}/rd1-error.log
    CustomLog ${APACHE_LOG_DIR}/rd1-access.log combined
</VirtualHost>

# plain-HTTP namevhost for sendText-style probes (http://rd1.sony.net/tv1/)
<VirtualHost *:80>
    ServerName rd1.sony.net
    DocumentRoot /var/www/rd1-portal

    ErrorLog ${APACHE_LOG_DIR}/rd1-error.log
    CustomLog ${APACHE_LOG_DIR}/rd1-access.log combined
</VirtualHost>
